# Model
model: "CrossAttentionH2"
dropout_rate: 0.5
n: 4
n_eeg: 10
n_ecg: 3
n_gsr: 1
n_eye: 4

# Cross-modal attention
attention_dim: 256
attention_heads: 8
attention_layers: 2
attention_dropout: 0.1

# Training
epochs: 50
patience: 10
train_batch_size: 64
test_batch_size: 32
num_workers: 4

# Precision: stable and reproducible full FP32 for all epochs
amp: false
amp_dtype: "bfloat16"
fp32_finetune_epochs: 0
allow_tf32: false
cudnn_benchmark: false
deterministic: true
wandb_watch: false
wandb_log_interval: 20

# OneCycleLR scheduler params
min_mom: 0.7403
max_mom: 0.7985
max_lr: 0.00000796
div_factor: 10
final_div_factor: 10
pct_start: 0.425
