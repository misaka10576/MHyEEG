# Dataset: LOSO fold 0 (13 train / 1 validation / 1 test subject)
dataset_root: "SEED_IV"
eeg_feature_kind: "de_LDS"
fold: 0
seed: 0

# Baseline model: SeedIVEEG, SeedIVEye, or SeedIVConcat
model: "SeedIVConcat"
hidden_dim: 128
embedding_dim: 64
dropout_rate: 0.3

# Training
epochs: 50
patience: 10
train_batch_size: 64
test_batch_size: 128
num_workers: 4
weight_decay: 0.001
label_smoothing: 0.05
max_grad_norm: 1.0

# OneCycleLR
max_lr: 0.0003
min_mom: 0.85
max_mom: 0.95
div_factor: 10
final_div_factor: 100
pct_start: 0.1

# Stable and reproducible full FP32
amp: false
amp_dtype: "bfloat16"
fp32_finetune_epochs: 0
allow_tf32: false
cudnn_benchmark: false
deterministic: true
wandb_watch: false
wandb_log_interval: 20

checkpoint_folder: "checkpoints/seed_iv_concat_fold0"
wandb_project: "MHyEEG-SEED-IV"
wandb_mode: "online"
